version: 2
updates:
  - package-ecosystem: npm
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Dubai
    open-pull-requests-limit: 5
    groups:
      api-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Dubai
    open-pull-requests-limit: 5
    groups:
      mobile-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Dubai
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /infra/blnk
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: Asia/Dubai
    open-pull-requests-limit: 5
