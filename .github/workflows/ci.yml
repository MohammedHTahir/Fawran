name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fawran
          POSTGRES_PASSWORD: fawran
          POSTGRES_DB: fawran_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fawran -d fawran_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
        env:
          DATABASE_URL: postgres://fawran:fawran@localhost:5432/fawran_test
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
